# Build + push the backend/judge image (shared). Context = repo root.
# Submit: gcloud builds submit --config cloudbuild.backend.yaml \
#           --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/direphish/backend:TAG .
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "docker/Dockerfile.backend", "-t", "${_IMAGE}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]
images: ["${_IMAGE}"]
options:
  # camel-oasis pulls PyTorch via sentence-transformers — needs CPU + disk.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
substitutions:
  _IMAGE: ""
timeout: 2400s
